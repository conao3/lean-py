name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish lean-python to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/project/lean-python/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: cachix/install-nix-action@v31.11.3
      - run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "v$v" = "${{ inputs.tag }}"
      - run: nix develop -c uv build
      - uses: pypa/gh-action-pypi-publish@v1.14.3
