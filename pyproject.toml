[project]
name = "lean-python"
version = "0.1.0"
description = "Run Lean 4 code as Python: a runtime for code generated from Lean's IR, Lean blocks in Python files, and pydantic models for Lean types"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Pydantic :: 2",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Repository = "https://github.com/conao3/lean-py"

[project.scripts]
lean-py = "lean_python.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-icdiff>=0.9", "hypothesis>=6", "fastapi>=0.115", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lean_python"]

[tool.hatch.build.targets.sdist]
include = ["src/lean_python", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 120
extend-exclude = ["test-out", "samples/**/_lean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
